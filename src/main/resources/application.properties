spring.application.name=fineract-integration

# Apache Fineract configuration
fineract.base-url=https://localhost:8443/fineract-provider/api/v1
fineract.tenant-id=default
fineract.username=${FINERACT_USERNAME:mifos}
fineract.password=${FINERACT_PASSWORD:password}

# Spring Boot server
server.port=8080
